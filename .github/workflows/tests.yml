name: tests

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup PHP
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2
        with:
          php-version: '8.4'
          tools: composer:v2
          coverage: xdebug

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: npm

      - name: Setup Application
        run: |
          composer install --prefer-dist --no-interaction
          cp .env.example .env
          php artisan key:generate --no-interaction
          touch database/database.sqlite
          php artisan migrate --force --no-interaction
          npm ci
          npm run build

      - parallel:
          - name: Run frontend checks
            run: |
              npm run lint:check
              npm run format:check
              npm run types:check
              node --test tests/*.test.mjs

          - name: Run PHP static checks
            run: |
              composer lint:check
              composer types:check

          - name: Run test coverage
            run: composer test:coverage

  package:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup PHP
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2
        with:
          php-version: '8.4'
          tools: composer:v2
          coverage: none

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: npm

      - name: Build production release
        env:
          VITE_TINYMCE_API_KEY: ${{ secrets.TINYMCE_API_KEY }}
        run: |
          cp .env.example .env
          composer install --no-dev --prefer-dist --no-interaction --optimize-autoloader
          php artisan key:generate --no-interaction
          npm ci
          npm run build:ssr
          test -f public/build/manifest.json
          test -f bootstrap/ssr/app.js
          npm prune --omit=dev
          test -d node_modules/@inertiajs/react
          rm .env
          tar \
            --exclude='.git' \
            --exclude='.github' \
            --exclude='.env' \
            --exclude='tests' \
            --exclude='storage' \
            --exclude='bootstrap/cache/*.php' \
            -czf "$RUNNER_TEMP/prodeals-release.tar.gz" .

      - name: Upload release artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: production-release
          path: ${{ runner.temp }}/prodeals-release.tar.gz
          if-no-files-found: error
          retention-days: 5

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.PRODUCTION_DEPLOY_ENABLED == 'true'
    needs: [ci, package]
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://prodeals.lk
    concurrency:
      group: prodeals-production
      cancel-in-progress: false

    steps:
      - name: Checkout deployment scripts
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download release artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: production-release
          path: artifact

      - name: Configure SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
        run: |
          install -m 700 -d "$HOME/.ssh"
          install -m 600 /dev/null "$HOME/.ssh/id_ed25519"
          install -m 600 /dev/null "$HOME/.ssh/known_hosts"
          printf '%s\n' "$SSH_PRIVATE_KEY" > "$HOME/.ssh/id_ed25519"
          printf '%s\n' "$SSH_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"

      - name: Deploy production release
        env:
          WEB_HOST: ${{ secrets.WEB_HOST }}
          WORKER_HOST: ${{ secrets.WORKER_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          RELEASE_ID: ${{ github.sha }}
        run: bash .github/deploy/deploy-production.sh artifact/prodeals-release.tar.gz
