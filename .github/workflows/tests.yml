name: tests

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: '8.4'
          tools: composer:v2
          coverage: xdebug

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'

      - name: Setup Application
        run: composer setup

      - name: Run CI Checks
        run: composer ci:check

  package:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: ci
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: '8.4'
          tools: composer:v2
          coverage: none

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'

      - name: Build production release
        env:
          VITE_TINYMCE_API_KEY: ${{ secrets.TINYMCE_API_KEY }}
        run: |
          cp .env.example .env
          composer install --no-dev --prefer-dist --no-interaction --optimize-autoloader
          php artisan key:generate --no-interaction
          npm ci
          npm run build:ssr
          test -f public/build/manifest.json
          test -f bootstrap/ssr/app.js
          npm prune --omit=dev
          test -d node_modules/@inertiajs/react
          rm .env
          tar \
            --exclude='.git' \
            --exclude='.github' \
            --exclude='.env' \
            --exclude='tests' \
            --exclude='storage' \
            --exclude='bootstrap/cache/*.php' \
            -czf "$RUNNER_TEMP/prodeals-release.tar.gz" .

      - name: Upload release artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: production-release
          path: ${{ runner.temp }}/prodeals-release.tar.gz
          if-no-files-found: error
          retention-days: 5

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.PRODUCTION_DEPLOY_ENABLED == 'true'
    needs: package
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://prodeals.lk
    concurrency:
      group: prodeals-production
      cancel-in-progress: false

    steps:
      - name: Checkout deployment scripts
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download release artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: production-release
          path: artifact

      - name: Configure SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
        run: |
          install -m 700 -d "$HOME/.ssh"
          install -m 600 /dev/null "$HOME/.ssh/id_ed25519"
          install -m 600 /dev/null "$HOME/.ssh/known_hosts"
          printf '%s\n' "$SSH_PRIVATE_KEY" > "$HOME/.ssh/id_ed25519"
          printf '%s\n' "$SSH_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"

      - name: Deploy production release
        env:
          WEB_HOST: ${{ secrets.WEB_HOST }}
          WORKER_HOST: ${{ secrets.WORKER_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          RELEASE_ID: ${{ github.sha }}
        run: |
          set -Eeuo pipefail

          ssh_options=(-o BatchMode=yes -o StrictHostKeyChecking=yes)
          remote_script="/tmp/prodeals-remote-release.sh"
          remote_artifact="/tmp/prodeals-${RELEASE_ID}.tar.gz"
          previous_release_id=""

          rollback() {
            exit_code="$?"
            trap - ERR
            set +e
            if [[ "$previous_release_id" =~ ^[0-9a-f]{40}$ ]]; then
              ssh "${ssh_options[@]}" "${DEPLOY_USER}@${WEB_HOST}" "${remote_script} rollback-to ${RELEASE_ID} ${previous_release_id}"
              ssh "${ssh_options[@]}" "${DEPLOY_USER}@${WORKER_HOST}" "${remote_script} rollback-to ${RELEASE_ID} ${previous_release_id}"
              ssh "${ssh_options[@]}" "${DEPLOY_USER}@${WEB_HOST}" 'sudo systemctl restart php8.4-fpm && sudo systemctl reload nginx && sudo systemctl restart prodeals-ssr'
              ssh "${ssh_options[@]}" "${DEPLOY_USER}@${WORKER_HOST}" 'sudo supervisorctl restart prodeals-worker'
            fi
            exit "$exit_code"
          }

          for host in "$WEB_HOST" "$WORKER_HOST"; do
            scp "${ssh_options[@]}" .github/deploy/remote-release.sh "${DEPLOY_USER}@${host}:${remote_script}"
            ssh "${ssh_options[@]}" "${DEPLOY_USER}@${host}" "chmod 700 ${remote_script}"
          done

          web_release_id="$(ssh "${ssh_options[@]}" "${DEPLOY_USER}@${WEB_HOST}" "${remote_script} current ${RELEASE_ID}")"
          worker_release_id="$(ssh "${ssh_options[@]}" "${DEPLOY_USER}@${WORKER_HOST}" "${remote_script} current ${RELEASE_ID}")"

          if [[ ! "$web_release_id" =~ ^[0-9a-f]{40}$ ]] || [[ "$web_release_id" != "$worker_release_id" ]]; then
            echo "Web and worker must start on the same release before deployment." >&2
            exit 1
          fi

          previous_release_id="$web_release_id"
          trap rollback ERR

          for host in "$WEB_HOST" "$WORKER_HOST"; do
            scp "${ssh_options[@]}" artifact/prodeals-release.tar.gz "${DEPLOY_USER}@${host}:${remote_artifact}"
            ssh "${ssh_options[@]}" "${DEPLOY_USER}@${host}" "${remote_script} prepare ${RELEASE_ID} ${remote_artifact}"
          done

          ssh "${ssh_options[@]}" "${DEPLOY_USER}@${WEB_HOST}" "${remote_script} migrate ${RELEASE_ID}"
          ssh "${ssh_options[@]}" "${DEPLOY_USER}@${WEB_HOST}" "${remote_script} migrate-media ${RELEASE_ID}"
          ssh "${ssh_options[@]}" "${DEPLOY_USER}@${WORKER_HOST}" 'sudo supervisorctl stop prodeals-worker || true'
          ssh "${ssh_options[@]}" "${DEPLOY_USER}@${WEB_HOST}" "${remote_script} activate ${RELEASE_ID}"
          ssh "${ssh_options[@]}" "${DEPLOY_USER}@${WORKER_HOST}" "${remote_script} activate ${RELEASE_ID}"
          ssh "${ssh_options[@]}" "${DEPLOY_USER}@${WEB_HOST}" 'sudo systemctl restart php8.4-fpm && sudo systemctl reload nginx && sudo systemctl restart prodeals-ssr'
          ssh "${ssh_options[@]}" "${DEPLOY_USER}@${WORKER_HOST}" 'sudo supervisorctl reread && sudo supervisorctl update && sudo supervisorctl restart prodeals-worker'

          for host in "$WEB_HOST" "$WORKER_HOST"; do
            active_release_id="$(ssh "${ssh_options[@]}" "${DEPLOY_USER}@${host}" "${remote_script} current ${RELEASE_ID}")"
            test "$active_release_id" = "$RELEASE_ID"
          done

          ssh "${ssh_options[@]}" "${DEPLOY_USER}@${WEB_HOST}" 'cd /var/www/prodeals/current && php8.4 artisan inertia:check-ssr'
          ssh "${ssh_options[@]}" "${DEPLOY_USER}@${WEB_HOST}" 'ss -ltn | grep -q "127.0.0.1:13714"'
          ssh "${ssh_options[@]}" "${DEPLOY_USER}@${WORKER_HOST}" 'sudo supervisorctl status prodeals-worker | grep -q RUNNING'
          ssh "${ssh_options[@]}" "${DEPLOY_USER}@${WORKER_HOST}" '! ss -ltn | grep -q "127.0.0.1:13714"'

          curl --fail --silent --show-error --retry 20 --retry-delay 3 --retry-max-time 90 \
            --retry-connrefused --retry-all-errors https://prodeals.lk/up

          homepage_html="$(mktemp)"
          product_html="$(mktemp)"
          curl --fail --silent --show-error https://prodeals.lk/ > "$homepage_html"
          grep -q 'Online Shopping &amp; Auctions in Sri Lanka' "$homepage_html"
          grep -qE 'href="[^"]*/(listings|auctions)' "$homepage_html"

          product_sitemap_url="$(curl --fail --silent --show-error https://prodeals.lk/sitemap.xml | grep -oE '<loc>[^<]*sitemaps/products-[^<]+' | head -1 | cut -c6-)"
          product_url="$(curl --fail --silent --show-error "$product_sitemap_url" | grep -oE '<loc>[^<]+' | head -1 | cut -c6-)"
          curl --fail --silent --show-error "$product_url" > "$product_html"
          grep -q '<h1' "$product_html"
          grep -qE 'Rs\.|LKR' "$product_html"
          grep -q 'application/ld+json' "$product_html"

          curl --fail --silent --show-error --max-time 30 \
            --header 'Accept: application/json, text/event-stream' \
            --header 'Content-Type: application/json' \
            --data '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2025-06-18","capabilities":{},"clientInfo":{"name":"deployment-smoke-test","version":"1.0.0"}}}' \
            https://prodeals.lk/mcp/marketplace

          for host in "$WEB_HOST" "$WORKER_HOST"; do
            ssh "${ssh_options[@]}" "${DEPLOY_USER}@${host}" "${remote_script} cleanup ${RELEASE_ID}"
            ssh "${ssh_options[@]}" "${DEPLOY_USER}@${host}" "rm -f ${remote_artifact} ${remote_script}"
          done

          trap - ERR
